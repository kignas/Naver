name: Build Navereat APK

on:
  push:
    branches: [main]
    paths:
      - 'navereat/**'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/scripts/**'
      - '!**/*.md'
      - '!navereat/docs/**'
      - '!verify/**'
  workflow_dispatch:
    inputs:
      simulate_failures:
        description: 'Point the first N release attempts at an invalid API host (retry-path test)'
        required: false
        default: '0'

permissions:
  contents: write

defaults:
  run:
    working-directory: navereat

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navereat/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('navereat/android/**/*.gradle*', 'navereat/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      # Two APKs from one run, same signing key, different data source:
      #   Navereat.apk      -> VITE_DATA_SOURCE=api  (the real product)
      #   Navereat-demo.apk -> VITE_DATA_SOURCE=demo (offline demo, .demo id)
      - name: Build web app (api)
        run: VITE_DATA_SOURCE=api npm run build

      - name: Sync Capacitor Android (api)
        run: npx cap sync android

      - name: Assemble API APK
        id: apk-api
        working-directory: navereat/android
        run: |
          chmod +x ./gradlew
          if ./gradlew assembleProdRelease -PversionCode=${{ github.run_number }} --no-daemon; then
            echo "path=android/app/build/outputs/apk/prod/release/app-prod-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=API release build failed::Falling back to the debug APK so device testing is not blocked."
            ./gradlew assembleProdDebug -PversionCode=${{ github.run_number }} --no-daemon
            echo "path=android/app/build/outputs/apk/prod/debug/app-prod-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship API APK
        env:
          APK_PATH: ${{ steps.apk-api.outputs.path }}
          VARIANT: ${{ steps.apk-api.outputs.variant }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep 'SHA-256 digest'
          echo "shipping the $VARIANT api build"
          cp "$APK_PATH" Navereat.apk
          ls -lh Navereat.apk

      - name: Build web app (demo)
        run: VITE_DATA_SOURCE=demo npm run build

      - name: Sync Capacitor Android (demo)
        run: npx cap sync android

      - name: Assemble demo APK
        id: apk-demo
        working-directory: navereat/android
        run: |
          if ./gradlew assembleDemoRelease -PversionCode=${{ github.run_number }} --no-daemon; then
            echo "path=android/app/build/outputs/apk/demo/release/app-demo-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Demo release build failed::Falling back to the debug APK so device testing is not blocked."
            ./gradlew assembleDemoDebug -PversionCode=${{ github.run_number }} --no-daemon
            echo "path=android/app/build/outputs/apk/demo/debug/app-demo-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship demo APK
        env:
          APK_PATH: ${{ steps.apk-demo.outputs.path }}
          VARIANT: ${{ steps.apk-demo.outputs.variant }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep 'SHA-256 digest'
          echo "shipping the $VARIANT demo build"
          cp "$APK_PATH" Navereat-demo.apk
          ls -lh Navereat-demo.apk

      # Side-by-side install needs one key and two ids; the demo label needs the
      # flavor's resource override to win over src/main.
      - name: Verify both APKs
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          api_sig=$("$BT/apksigner" verify --print-certs Navereat.apk | grep -m1 'SHA-256 digest')
          demo_sig=$("$BT/apksigner" verify --print-certs Navereat-demo.apk | grep -m1 'SHA-256 digest')
          echo "api  $api_sig"
          echo "demo $demo_sig"
          if [ "$api_sig" != "$demo_sig" ]; then
            echo "::error title=Signing keys differ::The two APKs would not install side by side."
            exit 1
          fi
          for apk in Navereat.apk Navereat-demo.apk; do
            echo "--- $apk"
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:" || echo "::warning title=badging unavailable::aapt2 could not read $apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Navereat-apks
          path: |
            navereat/Navereat.apk
            navereat/Navereat-demo.apk
          if-no-files-found: error

      # Notes are written here, not generated, so the release always states
      # which commit and run produced the two APKs.
      - name: Write release notes
        run: |
          {
            echo "Two APKs from the same commit, the same signing key, installable side by side:"
            echo
            echo "| file | data source | package | label |"
            echo "| --- | --- | --- | --- |"
            echo "| \`Navereat.apk\` | api (\`https://api.eatswada.com/api\`) | \`com.navereat.app\` | Navereat |"
            echo "| \`Navereat-demo.apk\` | demo (offline bundle) | \`com.navereat.app.demo\` | Navereat Demo |"
            echo
            echo "Both passed the workflow's \`apk verify\` step (signature, package, label)."
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/release-notes.md"

      # The artifacts are uploaded first (step above), so a failed publish never
      # loses the APKs: publish-release.yml can republish them from the run.
      #
      # The tag is v1.0.<run_number>, never <run_attempt>, so re-running this
      # run repairs the same release instead of creating a second tag.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.${{ github.run_number }}
          TITLE: Navereat v1.0.${{ github.run_number }}
          FILES: ${{ github.workspace }}/navereat/Navereat.apk ${{ github.workspace }}/navereat/Navereat-demo.apk
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          TARGET_SHA: ${{ github.sha }}
          SIMULATE_FAILURES: ${{ inputs.simulate_failures || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-release.sh"
