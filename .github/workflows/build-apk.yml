name: Build Navereat APK

on:
  push:
    branches: [main]
    paths:
      - 'navereat/**'
      - '.github/workflows/build-apk.yml'
      - '!**/*.md'
      - '!navereat/docs/**'
      - '!verify/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: navereat

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: navereat/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('navereat/android/**/*.gradle*', 'navereat/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Release is the shipped build: minified (R8) and resource-shrunk, signed
      # with the committed sideload key so it installs over the previous APK.
      # If R8 ever rejects the graph, the debug build keeps the tester loop
      # alive instead of failing the run.
      - name: Assemble APK
        id: apk
        working-directory: navereat/android
        run: |
          chmod +x ./gradlew
          if ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Release build failed::Falling back to the debug APK so device testing is not blocked."
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep 'SHA-256 digest'

      - name: Rename APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VARIANT: ${{ steps.apk.outputs.variant }}
        run: |
          echo "shipping the $VARIANT build"
          cp "$APK_PATH" Navereat.apk
          ls -lh Navereat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navereat-apk
          path: navereat/Navereat.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Navereat v1.0.${{ github.run_number }}
          files: navereat/Navereat.apk
          generate_release_notes: true
          draft: false
          prerelease: false
