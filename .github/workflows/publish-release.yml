name: Publish Navereat release

# Republish (or repair) a release from an existing build run without rebuilding.
# Use it when "Publish GitHub Release" in a build run gave up: the APKs are
# already in that run's Navereat-apks artifact, so this only retries the API.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id that holds the Navereat-apks artifact'
        required: true
      tag:
        description: 'Release tag to publish, e.g. v1.0.58 (use the build run''s v1.0.<run_number>)'
        required: true
      simulate_failures:
        description: 'Point the first N attempts at an invalid API host (retry-path test)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish release from a build run
    runs-on: ubuntu-latest

    steps:
      - name: Download the APKs from run ${{ inputs.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" -n Navereat-apks -D "$RUNNER_TEMP/apks"
          ls -lh "$RUNNER_TEMP/apks"

      # The tag belongs to the build run, not to this run: TARGET_SHA is that
      # run's head so a tag that does not exist yet lands on the built commit.
      - name: Resolve the built commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          sha=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.head_sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          RUN_ID: ${{ inputs.run_id }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          {
            echo "Two APKs from the same commit, the same signing key, installable side by side:"
            echo
            echo "| file | data source | package | label |"
            echo "| --- | --- | --- | --- |"
            echo "| \`Navereat.apk\` | api (\`https://api.eatswada.com/api\`) | \`com.navereat.app\` | Navereat |"
            echo "| \`Navereat-demo.apk\` | demo (offline bundle) | \`com.navereat.app.demo\` | Navereat Demo |"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: Navereat ${{ inputs.tag }}
          FILES: ${{ runner.temp }}/apks/Navereat.apk ${{ runner.temp }}/apks/Navereat-demo.apk
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          TARGET_SHA: ${{ steps.build.outputs.sha }}
          SIMULATE_FAILURES: ${{ inputs.simulate_failures || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-release.sh"
